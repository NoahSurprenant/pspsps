name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Pspsps.slnx
      - run: dotnet build Pspsps.slnx --no-restore -c Release
      # The integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - run: dotnet test Pspsps.slnx --no-build -c Release

  client:
    name: Client lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/pspsps
      - run: charts/pspsps/tests/render-test.sh
      - run: >-
          helm template pspsps charts/pspsps --set cluster.enabled=true --set cluster.kubeApi.cidr=10.0.0.1/32
          --set ingressRoute.enabled=true --set ingressRoute.host=pspsps.example
          --set ingress.enabled=true --set ingress.host=pspsps.example > /dev/null
      - run: helm lint charts/pspsps --set backup.enabled=true
      # Browser telemetry on, to the server's collector.
      - run: helm lint charts/pspsps --set telemetry.endpoint=http://otel-collector:4317 --set telemetry.browser=true
      - run: >-
          helm template pspsps charts/pspsps --set backup.enabled=true --set backup.persistence.existingClaim=dumps
          --set backup.timeZone=Etc/UTC > /dev/null

  backup:
    name: Backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The chart's backup script against PostgreSQL set up like the chart's (its image, user and database), then the
    # restores in docs/backups.md.
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Start the chart's PostgreSQL image
        run: |
          image=$(helm template pspsps charts/pspsps --show-only templates/postgres.yaml \
            | sed -n 's/^ *image: *//p' | head -n 1)
          echo "PG_IMAGE=$image" >> "$GITHUB_ENV"
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=pspsps -e POSTGRES_PASSWORD=backup -e POSTGRES_DB=pspsps "$image"
          tests/chart/pg-wait.sh postgres pspsps pspsps
      - run: tests/chart/backup-test.sh
        env:
          PG_CONTAINER: postgres
          PGPASSWORD: backup

  e2e-shards:
    name: Playwright (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gameplay
            suite: gameplay
          - name: accessibility
            suite: accessibility
          - name: layout-1
            suite: layout
            shard: "1/2"
          - name: layout-2
            suite: layout
            shard: "2/2"
    # The shipped image, run against PostgreSQL, driven by Chromium (software WebGL).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: pspsps
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pspsps:e2e .
      - name: Start the game
        run: |
          start() {
            docker run -d --name pspsps --network host \
              -e ConnectionStrings__Pspsps="Host=localhost;Database=pspsps;Username=postgres;Password=e2e" \
              -e ChatFilter__Lists__0__Action=Mask -e ChatFilter__Lists__0__Words__0=darn \
              -e ChatFilter__Lists__0__Words__1=heck \
              -e ChatFilter__Lists__1__Action=Refuse -e ChatFilter__Lists__1__Words__0=woof \
              -e ClientTelemetry__Enabled=true -e ClientTelemetry__OtlpEndpoint=http://localhost:4318 \
              -e Moderation__AddressKey=end-to-end-tests-network-key-0123456789 \
              "$@" pspsps:e2e
            timeout 120 bash -c 'until curl -fs http://localhost:8080/health/ready > /dev/null; do sleep 2; done'
          }
          start
          # The tests' admin: a guest made now, then listed by player ID in the server's settings (as production lists its
          # admins), which takes a restart. Its cookie still works after: the key ring is in the database.
          curl -fs -D admin-headers.txt -o admin.json -X POST http://localhost:8080/auth/guest
          cookie="$(sed -n 's/^[Ss]et-[Cc]ookie: \(pspsps=[^;]*\).*/\1/p' admin-headers.txt)"
          id="$(jq -r .id admin.json)"
          test -n "$cookie" && test -n "$id"
          echo "::add-mask::${cookie#pspsps=}"
          docker rm -f pspsps > /dev/null
          start -e Moderation__AdminPlayerIds__0="$id"
          echo "E2E_ADMIN_COOKIE=$cookie" >> "$GITHUB_ENV"
          rm admin-headers.txt admin.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the end-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
      - name: End-to-end tests
        working-directory: e2e
        run: |
          if [ -n "$E2E_SHARD" ]; then
            npm test -- --shard="$E2E_SHARD"
          else
            npm test
          fi
        env:
          E2E_SUITE: ${{ matrix.suite }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_BASE_URL: http://localhost:8080
      # Lighthouse on the sign-in screen and, signed in as a guest, the world list, with the phone and the desktop
      # settings (e2e/lighthouserc.cjs has the scores asked for). All four run; the step fails if any did.
      - name: Lighthouse
        if: ${{ !cancelled() && matrix.suite == 'accessibility' }}
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          CHROME_PATH="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          export CHROME_PATH
          cookie="$(curl -s -o /dev/null -D - -X POST http://localhost:8080/auth/guest | sed -n 's/^[Ss]et-[Cc]ookie: \(pspsps=[^;]*\).*/\1/p')"
          test -n "$cookie"
          failed=0
          for preset in mobile desktop; do
            for session in signed-out signed-in; do
              echo "::group::Lighthouse, $preset, $session"
              LIGHTHOUSE_PRESET=$preset LIGHTHOUSE_COOKIE="$([ $session = signed-in ] && echo "$cookie")" \
                npx lhci autorun || failed=1
              echo "::endgroup::"
            done
          done
          exit $failed
      # The reports, kept with the run rather than at public links: a signed-in run's settings carry the guest's cookie.
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() && matrix.suite == 'accessibility' && hashFiles('e2e/lighthouse/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: e2e/lighthouse
          retention-days: 30
          overwrite: true
      - name: Upload the shard's screenshots
        if: ${{ !cancelled() && hashFiles('e2e/screenshots/**/*.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.name }}
          path: e2e/screenshots/
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Server log
        if: failure()
        run: docker logs pspsps
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright-report
          retention-days: 7
          overwrite: true

  e2e:
    name: End-to-end (Playwright)
    needs: e2e-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Empty unless all the contact sheets were uploaded, so a run without them leaves the PR's last links alone.
      screenshots: ${{ steps.sheet_sign_in.outputs.artifact-url && steps.sheet_worlds.outputs.artifact-url && steps.sheet_town_square.outputs.artifact-url && steps.sheet_cafe.outputs.artifact-url && steps.sheet_shop_room.outputs.artifact-url && steps.sheet_player_card.outputs.artifact-url && steps.sheet_own_card.outputs.artifact-url && steps.sheet_own_card_rename.outputs.artifact-url && steps.sheet_friends.outputs.artifact-url && steps.sheet_catalogue.outputs.artifact-url && steps.sheet_home.outputs.artifact-url && steps.sheet_decorating.outputs.artifact-url && steps.sheet_report.outputs.artifact-url && steps.sheet_admin_card.outputs.artifact-url && steps.sheet_admin_page.outputs.artifact-url && steps.sheet_wardrobe.outputs.artifact-url && steps.sheet_garden.outputs.artifact-url && steps.sheet_riverside.outputs.artifact-url && steps.sheet_world_map.outputs.artifact-url && format('- [Sign-in]({0})\n- [World list]({1})\n- [Town Square]({2})\n- [Cat Café]({3})\n- [Cat Shop]({4})\n- [Player card]({5})\n- [Own card]({6})\n- [Own card, renaming]({7})\n- [Friends]({8})\n- [Catalogue]({9})\n- [Home]({10})\n- [Decorating]({11})\n- [Report]({12})\n- [Admin card]({13})\n- [Admin page]({14})\n- [Wardrobe]({15})\n- [Garden Courtyard]({16})\n- [Riverside Trail]({17})\n- [World map]({18})', steps.sheet_sign_in.outputs.artifact-url, steps.sheet_worlds.outputs.artifact-url, steps.sheet_town_square.outputs.artifact-url, steps.sheet_cafe.outputs.artifact-url, steps.sheet_shop_room.outputs.artifact-url, steps.sheet_player_card.outputs.artifact-url, steps.sheet_own_card.outputs.artifact-url, steps.sheet_own_card_rename.outputs.artifact-url, steps.sheet_friends.outputs.artifact-url, steps.sheet_catalogue.outputs.artifact-url, steps.sheet_home.outputs.artifact-url, steps.sheet_decorating.outputs.artifact-url, steps.sheet_report.outputs.artifact-url, steps.sheet_admin_card.outputs.artifact-url, steps.sheet_admin_page.outputs.artifact-url, steps.sheet_wardrobe.outputs.artifact-url, steps.sheet_garden.outputs.artifact-url, steps.sheet_riverside.outputs.artifact-url, steps.sheet_world_map.outputs.artifact-url) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-screenshots-*
          path: e2e/screenshots
          merge-multiple: true
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('e2e/screenshots/*/*.png') != '' }}
        with:
          node-version: 24
      - name: Install Chromium for the contact sheets
        if: ${{ hashFiles('e2e/screenshots/*/*.png') != '' }}
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Each screen's sizes side by side, even when a test failed (the pictures may show why), uploaded unzipped so
      # each opens in the browser; the screenshots job links them on the PR.
      - name: Make the screenshot contact sheets
        id: sheets
        if: ${{ !cancelled() && hashFiles('e2e/screenshots/*/*.png') != '' }}
        working-directory: e2e
        run: node contact-sheets.mjs
      - name: Upload the sign-in screenshots
        id: sheet_sign_in
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/sign-in.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the world list screenshots
        id: sheet_worlds
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/worlds.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the Town Square screenshots
        id: sheet_town_square
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/town-square.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the Cat Café screenshots
        id: sheet_cafe
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/cafe.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the Cat Shop screenshots
        id: sheet_shop_room
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/shop-room.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the Garden Courtyard screenshots
        id: sheet_garden
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/garden.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the Riverside Trail screenshots
        id: sheet_riverside
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/riverside.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the world map screenshots
        id: sheet_world_map
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/world-map.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the player card screenshots
        id: sheet_player_card
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/player-card.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the own card screenshots
        id: sheet_own_card
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/own-card.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the own card renaming screenshots
        id: sheet_own_card_rename
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/own-card-rename.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the friends list screenshots
        id: sheet_friends
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/friends.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the catalogue screenshots
        id: sheet_catalogue
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/catalogue.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the home screenshots
        id: sheet_home
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/home.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the decorating screenshots
        id: sheet_decorating
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/decorating.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the report form screenshots
        id: sheet_report
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/report.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the admin card screenshots
        id: sheet_admin_card
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/admin-card.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Upload the admin page screenshots
        id: sheet_admin_page
        if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/admin-page.png
          archive: false
          retention-days: 30
          overwrite: true
      # Every hat and collar on several coats, as the player cards picture them (e2e/tests/wardrobe.spec.ts).
      - name: Upload the wardrobe contact sheet
        id: sheet_wardrobe
        if: ${{ !cancelled() && hashFiles('e2e/screenshots/wardrobe.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: e2e/screenshots/wardrobe.png
          archive: false
          retention-days: 30
          overwrite: true
      - name: Require every browser shard to pass
        if: ${{ needs.e2e-shards.result != 'success' }}
        run: exit 1

  cluster-e2e:
    name: Two pods end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two server pods from the shipped image, clustered through Redis as plain containers (e2e/cluster/pods.sh): players
    # on different pods share a room, a ban on one pod closes connections on the other, and a pod is replaced under them.
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pspsps:e2e .
      - name: Start PostgreSQL, Redis and two server pods
        run: |
          e2e/cluster/pods.sh up > pods.env
          cookie="$(sed -n 's/^E2E_ADMIN_COOKIE=pspsps=//p' pods.env)"
          echo "::add-mask::$cookie"
          cat pods.env >> "$GITHUB_ENV"
          rm pods.env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the end-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
      - name: Two pods
        working-directory: e2e
        run: npm run test:cluster
      - name: Server logs and membership
        if: failure()
        run: |
          e2e/cluster/pods.sh members || true
          e2e/cluster/pods.sh logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-cluster
          path: e2e/playwright-report-cluster
          retention-days: 7

  kubernetes:
    name: Cluster mode in Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The chart with cluster.enabled in a throwaway kind cluster, whose network plugin enforces NetworkPolicies:
    # tests/chart/kind-test.sh says what it checks.
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: docker build -t pspsps:kind .
      - uses: helm/kind-action@v1
        with:
          cluster_name: pspsps
      - run: kind load docker-image pspsps:kind --name pspsps
      - run: tests/chart/kind-test.sh pspsps kind
      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl -n pspsps get pods,events -o wide || true
          kubectl -n pspsps logs -l app.kubernetes.io/component=server --tail=300 --prefix || true
          kubectl -n pspsps logs -l app.kubernetes.io/component=server --tail=100 --prefix --previous || true

  # On a PR, one comment with the screenshot contact sheets, which each run updates in place.
  screenshots:
    name: Screenshots comment
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.e2e.outputs.screenshots != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LINKS: ${{ needs.e2e.outputs.screenshots }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- pspsps-screenshots -->"
          body="$(printf '%s\n### Screenshots at every screen size (%s)\n\n%b\n' "$marker" "${SHA:0:7}" "$LINKS")"
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "${{ github.repository }}" --body "$body"
          fi
