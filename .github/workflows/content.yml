name: Content

# Runs the room editor's export, import and publish against the live game with no browser, so an agent (or the owner) can
# do them from the Actions tab or `gh workflow run content.yml -f action=...`. It calls /api/content with a bearer token
# (docs/content.md): the repository secret CONTENT_TOKEN, the in-cluster runner pspsps-k8s calls the game's Service, as Cloudflare answers GitHub-hosted runners with 403.
#   list     the rooms, with which have a draft
#   export   the live content as JSON, kept as an artifact (and printed in the log summary's size line)
#   import   loads ContentDrafts.json from the image that is deployed (merge the change and let it deploy first) as drafts
#   publish  publishes the room's draft (with: comma-separated rooms that go live together; at: an ISO time to schedule;
#            retire: comma-separated live rooms taken out of the game in the same step, so doors to them can go with it)
#   retire   takes the room (and those in "with") out of the game; the old version stays in the history

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [list, export, import, publish, retire]
        required: true
      room:
        description: publish - the room whose draft goes live
        type: string
        required: false
      with:
        description: publish - other rooms published together with it (comma-separated), e.g. a new room and the doors to it
        type: string
        required: false
      retire:
        description: publish - live rooms taken out of the game together with the publish (comma-separated)
        type: string
        required: false
      at:
        description: publish - schedule for this time instead of now (ISO 8601, UTC, in the future)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  content:
    runs-on: pspsps-k8s
    timeout-minutes: 5
    env:
      GAME_URL: http://pspsps.pspsps.svc.cluster.local
      CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
      ACTION: ${{ inputs.action }}
      ROOM: ${{ inputs.room }}
      WITH: ${{ inputs.with }}
      AT: ${{ inputs.at }}
      RETIRE: ${{ inputs.retire }}
    steps:
      - name: Check the settings
        run: |
          [ -n "$GAME_URL" ] || { echo "::error::Set the repository variable GAME_URL (https://host)"; exit 1; }
          [ -n "$CONTENT_TOKEN" ] || { echo "::error::Set the repository secret CONTENT_TOKEN (docs/content.md)"; exit 1; }
          echo "::add-mask::$CONTENT_TOKEN"

      - name: Run
        run: |
          set -euo pipefail
          call() {
            local out; out=$(mktemp)
            local code; code=$(curl --silent --show-error --max-time 120 -o "$out" -w '%{http_code}' -H "Authorization: Bearer $CONTENT_TOKEN" "$@") || { echo "::error::curl failed" >&2; return 1; }
            if [ "$code" -ge 400 ]; then echo "::error::HTTP $code: $(head -c 400 "$out")" >&2; return 1; fi
            echo "::notice::HTTP $code, $(wc -c < "$out") bytes, starts: $(head -c 80 "$out" | tr -d "\n")" >&2
            cat "$out"
          }
          case "$ACTION" in
            list)
              call "$GAME_URL/api/content/rooms" | tee rooms.json | jq .
              ;;
            export)
              call "$GAME_URL/api/content/export" > export.json
              jq '{rooms: (.rooms | length), overlays: (.overlays | length), looks: (.looks.rooms | length), painters: (.painters | length), wildlife: (.wildlife | length), propDesigns: (.propDesigns | length)}' export.json | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            import)
              call -X POST "$GAME_URL/api/content/import" | tee report.json | jq .
              {
                echo "### Import"
                jq -r '"applied: \(.applied | length), unchanged: \(.unchanged | length), problems: \(.problems | length)"' report.json
                jq -r '.problems[] | "- " + .' report.json
              } >> "$GITHUB_STEP_SUMMARY"
              [ "$(jq '.problems | length' report.json)" = 0 ] || { echo "::error::The import reported problems"; exit 1; }
              ;;
            publish)
              [ -n "$ROOM" ] || { echo "::error::publish needs room"; exit 1; }
              [[ "$ROOM" =~ ^[a-z0-9-]+$ ]] || { echo "::error::room is lower-case letters, digits and hyphens"; exit 1; }
              query=""
              IFS=',' read -ra others <<< "$WITH"
              for other in "${others[@]}"; do
                other="${other// /}"
                [ -z "$other" ] && continue
                [[ "$other" =~ ^[a-z0-9-]+$ ]] || { echo "::error::with: '$other' is not a room ID"; exit 1; }
                query="$query&with=$other"
              done
              IFS=',' read -ra going <<< "$RETIRE"
              for gone in "${going[@]}"; do
                gone="${gone// /}"
                [ -z "$gone" ] && continue
                [[ "$gone" =~ ^[a-z0-9-]+$ ]] || { echo "::error::retire: '$gone' is not a room ID"; exit 1; }
                query="$query&retire=$gone"
              done
              [ -z "$AT" ] || query="$query&at=$(jq -rn --arg v "$AT" '$v|@uri')"
              call -X POST "$GAME_URL/api/content/rooms/$ROOM/publish?${query#&}"
              echo "Published (or scheduled) $ROOM."
              ;;
            retire)
              [ -n "$ROOM" ] || { echo "::error::retire needs room"; exit 1; }
              [[ "$ROOM" =~ ^[a-z0-9-]+$ ]] || { echo "::error::room is lower-case letters, digits and hyphens"; exit 1; }
              query=""
              IFS=',' read -ra others <<< "$WITH"
              for other in "${others[@]}"; do
                other="${other// /}"
                [ -z "$other" ] && continue
                [[ "$other" =~ ^[a-z0-9-]+$ ]] || { echo "::error::with: '$other' is not a room ID"; exit 1; }
                query="$query&with=$other"
              done
              call -X POST "$GAME_URL/api/content/rooms/$ROOM/retire?${query#&}"
              echo "Retired $ROOM ${WITH:+and $WITH}."
              ;;
          esac

      - name: Keep the export
        if: inputs.action == 'export'
        uses: actions/upload-artifact@v7
        with:
          name: content-export
          path: export.json
          retention-days: 30
