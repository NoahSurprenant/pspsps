{{- $fullname := include "pspsps.fullname" . -}}
{{- $chatFilter := .Values.chatFilter.existingConfigMap | default (ternary (printf "%s-chat-filter" $fullname) "" (not (empty .Values.chatFilter.lists))) -}}
{{- $wait := int .Values.server.databaseStartupWaitSeconds -}}
{{- if or (lt $wait 1) (gt $wait 120) }}
{{- /* The startup probe below is sized for at most 120 s of waiting. */}}
{{- fail "server.databaseStartupWaitSeconds must be from 1 to 120" }}
{{- end }}
{{- if and .Values.cluster.enabled (lt (int .Values.cluster.replicas) 2) }}
{{- /* One pod is the default mode: a cluster of one would only add Redis, and its disruption budget would block drains. */}}
{{- fail "cluster.replicas must be at least 2 with cluster.enabled (one pod: leave cluster.enabled false)" }}
{{- end }}
{{- if or (lt (int .Values.cluster.preStopSeconds) 0) (gt (int .Values.cluster.preStopSeconds) 10) }}
{{- /* terminationGracePeriodSeconds (60) covers it and the 45 s shutdown. */}}
{{- fail "cluster.preStopSeconds must be from 0 to 10" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pspsps.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ if .Values.cluster.enabled }}{{ .Values.cluster.replicas }}{{ else }}1{{ end }}
  {{- if .Values.cluster.enabled }}
  # One new pod at a time, never fewer than asked for: rooms move off a pod as it stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  # A single silo with no shared membership table: two at once would each think they own every room.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "pspsps.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pspsps.selectorLabels" (dict "root" . "component" "server") | nindent 8 }}
        orleans/serviceId: {{ .Values.orleans.serviceId | quote }}
        orleans/clusterId: {{ .Values.orleans.clusterId | quote }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: {{ .Values.cluster.enabled }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Room for the preStop wait (cluster mode), then the host's shutdown (DOTNET_SHUTDOWNTIMEOUTSECONDS): the hub's
      # connections close (the browsers reconnect to another pod), then the silo leaves the cluster and hands its grains
      # on.
      terminationGracePeriodSeconds: 60
      {{- if and .Values.cluster.enabled .Values.cluster.topologySpread }}
      # The pods on different nodes where they can be: one node going down doesn't take the whole game.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pspsps.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "pspsps.imageRef" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.cluster.enabled }}
            - name: silo
              containerPort: 11111
            - name: gateway
              containerPort: 30000
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Pspsps
              value: "Host={{ include "pspsps.postgresHost" . }};Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD)"
            {{- end }}
            {{- if .Values.cluster.enabled }}
            - name: ConnectionStrings__Redis
              value: "{{ include "pspsps.redisHost" . }}:6379"
            # Orleans' Kubernetes hosting on Redis membership (src/Pspsps.Server/Game/OrleansSetup.cs).
            - name: Orleans__Clustering
              value: Kubernetes
            - name: ORLEANS_SERVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['orleans/serviceId']
            - name: ORLEANS_CLUSTER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['orleans/clusterId']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            - name: Database__StartupWaitSeconds
              value: {{ $wait | quote }}
            - name: DOTNET_SHUTDOWNTIMEOUTSECONDS
              value: "45"
            {{- if $chatFilter }}
            # A ConfigMap volume changes by swapping a symlink, which file events miss: poll the chat filter's file.
            - name: DOTNET_USE_POLLING_FILE_WATCHER
              value: "true"
            {{- end }}
            - name: HealthChecks__MaxAllocatedMegabytes
              value: {{ .Values.healthChecks.maxAllocatedMegabytes | quote }}
            {{- with .Values.telemetry }}
            {{- if .endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .serviceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "deployment.environment.name=%s" .environment | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .sampleRatio | quote }}
            {{- end }}
            {{- if .browser }}
            {{- if not .endpoint }}
            {{- fail "telemetry.browser needs telemetry.endpoint" }}
            {{- end }}
            - name: ClientTelemetry__Enabled
              value: "true"
            - name: ClientTelemetry__OtlpEndpoint
              value: {{ include "pspsps.browserOtlpEndpoint" $ | quote }}
            {{- end }}
            {{- end }}
            {{- range $i, $network := .Values.forwardedHeaders.knownIPNetworks }}
            - name: ForwardedHeaders__KnownIPNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            {{- range $i, $id := .Values.moderation.adminPlayerIds }}
            - name: Moderation__AdminPlayerIds__{{ $i }}
              value: {{ $id | quote }}
            {{- end }}
            {{- with .Values.forwardedHeaders.forwardedForHeaderName }}
            - name: ForwardedHeaders__ForwardedForHeaderName
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            # 240 s: the longest database wait (120 s, plus one 5 s attempt), then the migration's retries (7 connects
            # of at most 5 s, about 40 s of backoff) before /health/live answers.
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          {{- if .Values.cluster.enabled }}
          # Out of the Service's endpoints before the server starts stopping: the proxies stop sending this pod new
          # connections first, so none land on a pod that's closing.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.cluster.preStopSeconds }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $chatFilter }}
            # Over the image's empty lists; no subPath, so changes to the ConfigMap reach the pod.
            - name: chat-filter
              mountPath: /app/chat-filter
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $chatFilter }}
        - name: chat-filter
          configMap:
            name: {{ $chatFilter }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
