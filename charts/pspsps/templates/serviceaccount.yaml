apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pspsps.fullname" . }}
  labels:
    {{- include "pspsps.labels" . | nindent 4 }}
# The server's pods mount the token only in cluster mode, where Orleans reads the pods.
automountServiceAccountToken: false
{{- if .Values.cluster.enabled }}
---
# Orleans' Kubernetes hosting watches the pods and marks silos whose pod is gone as dead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pspsps.fullname" . }}-orleans
  labels:
    {{- include "pspsps.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pspsps.fullname" . }}-orleans
  labels:
    {{- include "pspsps.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pspsps.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pspsps.fullname" . }}-orleans
{{- end }}
