{{- with .Values.ingressRoute }}
{{- if .enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "pspsps.fullname" $ }}
  labels:
    {{- include "pspsps.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    - match: Host(`{{ required "ingressRoute.host is required when ingressRoute.enabled" .host }}`)
      kind: Rule
      {{- with .middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "pspsps.fullname" $ }}
          port: 80
          {{- if .sticky }}
          # For browsers that can't open a WebSocket and fall back to SignalR's negotiation (docs/cluster.md).
          sticky:
            cookie:
              name: pspsps-pod
              httpOnly: true
              secure: true
              sameSite: lax
          {{- end }}
{{- end }}
{{- end }}
