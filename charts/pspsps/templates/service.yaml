apiVersion: v1
kind: Service
metadata:
  name: {{ include "pspsps.fullname" . }}
  labels:
    {{- include "pspsps.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "pspsps.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
