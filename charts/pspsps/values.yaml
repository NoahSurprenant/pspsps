# One pod by default: the server is a single Orleans silo, with no Redis. cluster.enabled makes it a cluster of
# cluster.replicas pods (Orleans silos joined through Redis, SignalR's backplane on the same Redis).
cluster:
  enabled: false
  replicas: 2
  # Orleans' Kubernetes hosting reads the pods through the API server; the NetworkPolicy lets the server reach it.
  # The API server's address as the pods see it (an ipBlock: Services aren't matched by NetworkPolicies).
  kubeApi:
    cidr: ""
    port: 6443

image:
  repository: ghcr.io/noahsurprenant/pspsps
  # A tag, or tag@digest to pin it (master@sha256:...).
  tag: master
  pullPolicy: IfNotPresent

# The Secret with the server's settings, as environment variable names:
#   POSTGRES_PASSWORD   the database password (letters and digits: it goes into a connection string)
#   Authentication__Discord__ClientId, Authentication__Discord__ClientSecret     (optional)
#   Authentication__Google__ClientId, Authentication__Google__ClientSecret       (optional)
#   Moderation__AddressKey   (optional) the secret network bans hash addresses with (HMAC-SHA256), at least 32
#                            random characters: with it, admins can ban a banned player's networks too
#                            (moderation.addressBans). Keep it the same across restarts: a new key forgets every network.
# With postgres.enabled false, ConnectionStrings__Pspsps instead of POSTGRES_PASSWORD.
existingSecret: pspsps

# Orleans IDs, as pod labels. Keep clusterId fixed so rolling updates join the running cluster.
orleans:
  serviceId: pspsps
  clusterId: pspsps

# Logs, metrics and traces over OTLP (OTEL_* environment variables). Off when endpoint is empty.
telemetry:
  endpoint: ""
  # grpc (port 4317) or http/protobuf (4318).
  protocol: grpc
  serviceName: pspsps
  environment: prod
  # Share of root spans kept (every hub call is a root); calls inside a kept trace are always kept.
  sampleRatio: "0.1"
  # The players' browsers too: their errors, HTTP and hub call spans (which the server's spans continue), connection
  # log lines and performance numbers, posted to the server and forwarded to the collector as OTLP/JSON over HTTP.
  # Needs endpoint. docs/telemetry.md, "From the browser".
  browser: false
  # The collector's OTLP/HTTP base for the browsers' telemetry. Empty: endpoint, with port 4317 made 4318 when the
  # protocol is grpc (the same collector's HTTP port, which networkPolicy.telemetryTo opens too).
  browserOtlpEndpoint: ""

# Who may set the client address and scheme through X-Forwarded-* (or the header named below): the proxy in front,
# as CIDRs. Empty: nobody, so the app sees the proxy as the client and http as the scheme.
forwardedHeaders:
  knownIPNetworks: []
  # e.g. X-Real-IP, when the proxy has already resolved the client.
  forwardedForHeaderName: ""

healthChecks:
  # Managed memory above this reports Degraded on /health: about 75% of the server's memory limit.
  maxAllocatedMegabytes: 576

# The chat filter's word lists: each list masks its words (starred out) or refuses the whole line, one word per
# entry. Empty: the image has none, so nothing is filtered. The lists go in a ConfigMap mounted over the image's empty
# copy, which the server rereads when it changes, so editing the ConfigMap changes the filter without restarting a pod.
chatFilter:
  lists: []
  #  - action: Refuse
  #    words: [some, words]
  #  - action: Mask
  #    words: [other, words]
  # Or a ConfigMap of your own, with a chat-filter.json key in the format of
  # src/Pspsps.Server/chat-filter/chat-filter.json. Takes the place of lists.
  existingConfigMap: ""

# The game's admins, by player ID: they warn, mute and ban players, from a player's card in the game and from /admin.
# A player finds their own ID on their card (a tap on their own cat, then Details) or on /admin. This list is the only
# way to become an admin; guests can be admins too. Empty: nobody is.
moderation:
  adminPlayerIds: []
  #  - 0196d5a8-6b1e-7c3a-9f00-1234567890ab
  # Network bans: an admin banning a player can ban the networks it played from in the last 7 days too, for a day or a
  # week, so a banned guest can't come back as a new cat from there. The server keeps only keyed hashes of networks
  # (an IPv6 address by its /64), for 7 days (docs/privacy.md). Needs Moderation__AddressKey in existingSecret, and
  # forwardedHeaders.knownIPNetworks set to the proxy in front: without it every player looks like the proxy, whose
  # private address is never kept, so no network can be banned (the server warns as it starts).
  addressBans:
    # "": on exactly when the Secret has the key. true: the server refuses to start without the key. false: off (what
    # was kept is forgotten within the hour).
    enabled: ""

extraEnv: []

server:
  # How long the server waits at startup for PostgreSQL to answer before migrating anyway (Database:StartupWaitSeconds),
  # from 1 to 120. A new pod's first connections can be refused or dropped while its network policy is applied. The
  # startup probe allows 240 s, room for the longest wait and the migration's retries after it.
  databaseStartupWaitSeconds: 90
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

# A plain Kubernetes Ingress...
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

# ...or a Traefik IngressRoute.
ingressRoute:
  enabled: false
  host: ""
  entryPoints: [websecure]
  middlewares: []
  annotations: {}

postgres:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  database: pspsps
  username: pspsps
  persistence:
    size: 5Gi
    storageClass: ""
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# A scheduled pg_dump of the chart's PostgreSQL (needs postgres.enabled), in pg_dump's custom format, onto a volume.
# Restoring one: docs/backups.md.
backup:
  enabled: false
  # Cron syntax, in the controller's time zone unless timeZone is set (an IANA name, e.g. Europe/Paris).
  schedule: "0 3 * * *"
  timeZone: ""
  # How many dumps to keep, at least 2. A run deletes nothing until its new dump is complete, then the oldest beyond
  # keep; size the volume for keep + 1 dumps. If the volume fills up anyway, the run deletes the oldest dump (never
  # the only one) and tries once more.
  keep: 7
  # A run still going after this many seconds is stopped (and counts as failed). Also how old a run's unfinished
  # .partial file must be before a later run deletes it.
  activeDeadlineSeconds: 3600
  # How long a run keeps trying to reach the database before it fails (with nothing changed): a new pod's network can
  # take a moment to be allowed. It tries every 5 seconds, each try given at most the time left, then once more to
  # log the reason (at most 5 s); a slow name lookup can add to that. Must be below activeDeadlineSeconds.
  connectTimeoutSeconds: 120
  persistence:
    # A PersistentVolumeClaim to write the dumps to instead of the chart's own (which is made only when this is
    # empty). The pod runs as uid/gid 70 with fsGroup 70: the claim must be writable by them.
    existingClaim: ""
    # Room for keep + 1 dumps.
    size: 10Gi
    storageClass: ""
    # helm.sh/resource-policy: keep on the chart's claim, so uninstalling the chart leaves the dumps (delete the claim
    # by hand when they are no longer wanted). false: uninstalling deletes them too.
    keepOnUninstall: true
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Used only with cluster.enabled: Orleans' membership table and the SignalR backplane. Orleans needs it durable, so
# it writes an append-only file to its volume.
redis:
  image:
    repository: docker.io/library/redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClass: ""
    annotations: {}
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

networkPolicy:
  enabled: true
  # Who may reach the server's HTTP port (the ingress controller). Empty: anyone.
  serverFrom: []
  dns:
    to:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        podSelector: { matchLabels: { k8s-app: kube-dns } }
  # The OTLP collector (telemetry.endpoint), ports 4317 and 4318. Empty: no telemetry egress.
  telemetryTo: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Where the server's pods (and the backup job's) run.
nodeSelector: {}
tolerations: []
affinity: {}
